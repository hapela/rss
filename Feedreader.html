<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bekannte schädliche Mails</title>

<style>
:root{
    --bg:#121212;
    --card:#1f1f1f;
    --card-hover:#292929;
    --text:#f0f0f0;
    --muted:#b5b5b5;
    --accent:#2196f3;
    --danger:#d32f2f;
    --warning:#ffb300;
    --border:#3f3f3f;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Segoe UI",Arial,sans-serif;
}

header{
    padding:20px;
    border-bottom:1px solid var(--border);
    background:#181818;
}

header h1{
    margin:0;
    font-size:28px;
}

header p{
    margin-top:8px;
    color:var(--muted);
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.status{
    text-align:center;
    padding:20px;
    color:var(--muted);
}

.feed-card{
    background:var(--card);
    border-left:5px solid var(--warning);
    border-radius:10px;
    margin-bottom:15px;
    overflow:hidden;
    box-shadow:0 2px 6px rgba(0,0,0,.3);
}

.feed-card:hover{
    background:var(--card-hover);
}

.feed-summary{
    padding:15px;
    cursor:pointer;
}

.feed-header{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

.feed-title{
    flex:1;
    font-size:18px;
    font-weight:600;
}

.badge{
    background:var(--danger);
    color:white;
    padding:4px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.feed-meta{
    margin-top:10px;
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    color:var(--muted);
    font-size:14px;
}

.feed-preview{
    margin-top:10px;
    color:#ddd;
    line-height:1.5;
}

.expand{
    margin-top:10px;
    color:#7ec8ff;
    font-size:13px;
}

.feed-details{
    display:none;
    padding:20px;
    border-top:1px solid var(--border);
    background:#202020;
}

.feed-details img{
    max-width:100%;
    height:auto;
    border-radius:6px;
    border:1px solid #666;
    margin-top:10px;
}

.feed-details a{
    color:#7ec8ff;
}

.feed-details blockquote{
    margin-left:20px;
    border-left:3px solid #555;
    padding-left:10px;
}

.feed-details p{
    line-height:1.6;
}

.feed-details div{
    color:#f0f0f0;
}

.loading{
    text-align:center;
    padding:30px;
}
</style>
</head>
<body>

<header>
    <h1>🛡️ Bekannte schädliche Mails</h1>
    <p>Phishing- und Malware-Meldungen aus dem RSS-Feed</p>
</header>

<div class="container">

    <div id="status" class="status">
        Feed wird geladen ...
    </div>

    <div id="feed"></div>

</div>

<script>

const FEED_URL =
"https://raw.githubusercontent.com/hapela/rss/main/feed.xml";

function getValue(text, field){

    const regex = new RegExp(
        field + "\\s*:?\\s*(.+)",
        "i"
    );

    const match = text.match(regex);

    return match ? match[1].trim() : "";
}

function toggleDetails(id){

    const el =
        document.getElementById(id);

    if(el.style.display === "block"){
        el.style.display = "none";
    }else{
        el.style.display = "block";
    }
}

async function loadFeed(){

    try{

        const response = await fetch(
            "https://api.allorigins.win/raw?url=" +
            encodeURIComponent(FEED_URL)
        );

        const xmlText =
            await response.text();

        const parser =
            new DOMParser();

        const xml =
            parser.parseFromString(
                xmlText,
                "text/xml"
            );

        const items =
            [...xml.querySelectorAll("item")];

        document.getElementById("status")
            .innerHTML =
            `✅ ${items.length} Meldung(en) geladen`;

        const html =
            items.map((item,index)=>{

                const title =
                    item.querySelector("title")
                    ?.textContent || "";

                const description =
                    item.querySelector("description")
                    ?.textContent || "";

                const pubDate =
                    item.querySelector("pubDate")
                    ?.textContent || "";

                let contentEncoded = "";

                const encoded =
                    item.getElementsByTagNameNS(
                        "http://purl.org/rss/1.0/modules/content/",
                        "encoded"
                    );

                if(encoded.length > 0){
                    contentEncoded =
                        encoded[0].textContent;
                }

                const sender =
                    getValue(
                        description,
                        "Absender"
                    );

                const attack =
                    getValue(
                        description,
                        "Angriffstyp"
                    );

                const summary =
                    description
                        .split("📧")[0]
                        .trim();

                return `

<div class="feed-card">

    <div class="feed-summary"
         onclick="toggleDetails('d${index}')">

        <div class="feed-header">

            <div class="feed-title">
                ${title}
            </div>

            <div class="badge">
                ${attack || "Warnung"}
            </div>

        </div>

        <div class="feed-meta">

            <div>
                📧 ${sender || "-"}
            </div>

            <div>
                📅 ${pubDate}
            </div>

        </div>

        <div class="feed-preview">
            ${summary}
        </div>

        <div class="expand">
            ▼ Details anzeigen
        </div>

    </div>

    <div class="feed-details"
         id="d${index}">

        ${contentEncoded}

    </div>

</div>

`;
            }).join("");

        document.getElementById("feed")
            .innerHTML = html;

    }
    catch(error){

        console.error(error);

        document.getElementById("status")
            .innerHTML =
            "❌ Feed konnte nicht geladen werden.";
    }
}

loadFeed();

</script>

</body>
</html>
